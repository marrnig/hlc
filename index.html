
<html>
	<head>
		<link rel="icon" type="image/x-icon" href="LCI_emblem_2color.png">
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Harpenden Lions Club</title>
		<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
		<style>
			html, body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
			}
			.fullscreen {
				width: 100vw;
				height: 100vh;
				background: #ebb700;
				color: #1a1a1a;
				display: flex;
				flex-direction: column;
				justify-content: flex-start;
				align-items: center;
				text-align: center;
			}
			.container {
				display: flex;
				flex-direction: column;
				gap: 0rem;
				align-items: center;
			}
			.logo {
				width: 120px;
				height: 120px;
				margin-bottom: 1rem 0rem;
				object-fit: contain;
			}
			h1 {
				font-size: 3.5rem;
				font-weight: 700;
				margin: 0;
				margin-bottom: 1rem;
				letter-spacing: -1px;
				color: #003DA5;
			}

			@media (max-width: 768px) {
				h1 {
					font-size: 2.5rem;
					margin-bottom: 0.5rem;
				}
			}

			@media (max-width: 480px) {
				h1 {
					font-size: 2rem;
				}
			}

			.subtitle {
				font-size: 1.1rem;
				opacity: 0.75;
				margin: 0;
				font-weight: 300;
				margin-bottom: 2rem;
				color: #003DA5;
			}

			@media (max-width: 768px) {
				.subtitle {
					font-size: 1rem;
					margin-bottom: 1.5rem;
				}
			}
			.links-grid {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
				gap: 1rem;
				max-width: 600px;
				width: 90%;
				padding: 0 20px;
			}

			@media (max-width: 768px) {
				.links-grid {
					grid-template-columns: 1fr;
					width: 95%;
				}
			}
			.link-card {
				background: rgba(255, 255, 255, 0.25);
				backdrop-filter: blur(10px);
				border: 2px solid rgba(255, 255, 255, 0.4);
				border-radius: 16px;
				padding: 1rem;
				text-decoration: none;
				color: #1a1a1a;
				transition: all 0.3s ease;
				cursor: pointer;
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 0.5rem;
			}

			@media (max-width: 480px) {
				.link-card {
					padding: 1.5rem;
				}
			}
			.link-card:hover {
				background: rgba(255, 255, 255, 0.35);
				border-color: rgba(255, 255, 255, 0.6);
				transform: translateY(-8px);
				box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
			}
			.link-card-title {
				font-size: 1.5rem;
				font-weight: 600;
				color: #003DA5;
			}
			.link-card-desc {
				font-size: 0.95rem;
				opacity: 0.7;
				font-weight: 300;
				color: #003DA5;
			}
		</style>
	</head>
	<body>
		<div class="fullscreen">
			<div class="container">
				<img src="LCI_emblem_2color.png" alt="Lions Club Logo" class="logo">
				<h1>Harpenden Lions</h1>
				<p class="subtitle">Serving our community</p>
				<div class="links-grid">
					<a href="Bookshop-shift-scheduler.html" class="link-card">
						<div class="link-card-title">📚 Bookshop Scheduler</div>
						<div class="link-card-desc">Manage volunteer shifts</div>
					</a>
					<a href="availability-form-v2.html" class="link-card">
						<div class="link-card-title">📚 Availability Form</div>
						<div class="link-card-desc">Enter volunteer shifts</div>
					</a>
				</div>
			</div>
		</div>
	</body>
</html>
